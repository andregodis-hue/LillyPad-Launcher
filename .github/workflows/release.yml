# Reproducible Windows release build, signed by SignPath Foundation, then published as artifacts.
# Nothing here uses a secret in the build job. The updater key is only used in the last job, and only by tauri signer.
# Every action is pinned by commit hash. Update a pin only after reading the diff.
#   actions/checkout                         3d3c42e5aac5ba805825da76410c181273ba90b1  v7.0.1
#   actions/upload-artifact                  cf430e030ddbb5b0abf93d22962f4752f3646cd9  v7.0.2
#   actions/download-artifact                9000827ccba6bdab643e8b6fd33ac0654aef8333  v8.0.2
#   signpath/github-action-submit-signing-request  f6d04783b4569d051e0c80105fe66e82819d0092  v3.0
name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions: {}

env:
  RUST_VERSION: "1.99.1"
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (exact version)
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: Tools (exact versions, locked)
        shell: bash
        run: cargo install --locked cargo-audit cargo-deny && cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION"
      - name: Audit and licence policy
        shell: bash
        working-directory: app/src-tauri
        run: |
          cargo audit
          cargo deny check advisories bans licenses sources
      - name: Tests
        shell: bash
        working-directory: app/src-tauri
        run: cargo test --locked
      - name: Build installer (public build, no test mode feature)
        shell: bash
        working-directory: app/src-tauri
        env:
          LILLYPAD_MS_CLIENT_ID: ${{ vars.LILLYPAD_MS_CLIENT_ID }}
          SOURCE_DATE_EPOCH: "1767225600"
        # createUpdaterArtifacts is switched off here: the updater signature must be made AFTER SignPath signs the installer.
        run: cargo tauri build --ci --locked --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package for signing
        shell: bash
        run: |
          mkdir unsigned
          cp app/src-tauri/target/release/bundle/nsis/*-setup.exe unsigned/
          (cd unsigned && sha256sum *.exe > ../unsigned.sha256)
          cat unsigned.sha256
      - name: Upload unsigned installer
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: unsigned-installer
          path: |
            unsigned/*.exe
            unsigned.sha256
          if-no-files-found: error

  sign:
    needs: build
    # Runs only when the SignPath values are set in the repository variables. Until then the workflow stops after build.
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Submit signing request (a person approves it in SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Upload signed installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-installer
          path: signed/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-installer
          path: signed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: Updater signature and latest.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cargo install --locked tauri-cli --version "$TAURI_CLI_VERSION"
          f=$(ls signed/*-setup.exe)
          cargo tauri signer sign "$f"        # writes "$f.sig", reads the key from the environment
          sha256sum "$f" > signed/SHA256SUMS.txt
          cat signed/SHA256SUMS.txt
          python3 -I src/tools/make_latest_json.py "$f" "${GITHUB_REF_NAME}" > signed/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-files
          path: signed/

[package]
name = "lillypad-launcher"
version = "0.1.0"
description = "Lillypad Launcher for Lulumon"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[lib]
name = "lillypad_launcher_lib"
path = "src/lib.rs"

[[bin]]
name = "lillypad-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test build only: Play works with an offline player name, no Microsoft login. Never enabled in public releases.
testmode = []

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
minisign-verify = "0.2"
url = "2"
open = "5"
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tauri-plugin-updater = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
